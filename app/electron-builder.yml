appId: com.frigade.hob
productName: Hob
electronVersion: 44.7.2
copyright: Copyright © 2026 Frigade
publish:
  provider: github
  owner: FrigadeHQ
  repo: hob
  releaseType: release
extraMetadata:
  name: hob
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
  - "!**/node_modules/onnxruntime-node/**"
  - "!**/node_modules/sharp/**"
  - "!**/node_modules/@img/**"
extraResources:
  - from: plugins
    to: plugins
  - from: resources/bin
    to: bin
  - from: resources/licenses
    to: licenses
fileAssociations:
  - ext: [mcpb, dxt]
    name: MCP Bundle
    role: Viewer
    rank: Alternate
asarUnpack:
  - "**/node_modules/node-llama-cpp/**"
  - "**/node_modules/@node-llama-cpp/**"
mac:
  files:
    - out/**
    - package.json
    - "!**/node_modules/onnxruntime-node/**"
    - "!**/node_modules/sharp/**"
    - "!**/node_modules/@img/**"
    - "!**/node_modules/@node-llama-cpp/{linux,win,mac-x64}*/**"
    - "!**/node_modules/node-llama-cpp/bins/{linux,win,mac-x64}*/**"
  artifactName: Hob-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: Hob uses the microphone for dictation. Speech is turned into text on this computer.
    NSCalendarsFullAccessUsageDescription: Hob reads and adds events in your calendars when you ask it to. Everything stays on this Mac.
    NSCalendarsUsageDescription: Hob reads and adds events in your calendars when you ask it to. Everything stays on this Mac.
    NSRemindersFullAccessUsageDescription: Hob reads and adds reminders when you ask it to. Everything stays on this Mac.
    NSRemindersUsageDescription: Hob reads and adds reminders when you ask it to. Everything stays on this Mac.
    NSAppleEventsUsageDescription: Hob uses the Mail app to find and read your email and write drafts when you ask it to. It never sends email itself.
dmg:
  title: Hob
  background: build/background.png
  iconSize: 96
  window: { width: 660, height: 400 }
  contents:
    - { x: 180, y: 205 }
    - { x: 480, y: 205, type: link, path: /Applications }
  sign: true
win:
  artifactName: Hob-windows-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: true
linux:
  executableName: hob
  artifactName: Hob-linux-${arch}.${ext}
  target:
    - target: AppImage
      arch: [x64]
  icon: build/icon.png
  category: Utility
